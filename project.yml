name: ModularBank

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  FeatureSplash:
    path: Packages/FeatureSplash
  FeatureAuth:
    path: Packages/FeatureAuth
  FeatureMain:
    path: Packages/FeatureMain

targets:
  ModularBank:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
    info:
      path: App/Resources/Info.plist
    dependencies:
      - package: Core
        product: CoreKit
      - package: Core
        product: CoreNavigation
      - package: Core
        product: CoreNetwork
      - package: Core
        product: CoreGuards
      - package: DesignSystem
        product: DesignSystem
      - package: FeatureSplash
        product: FeatureSplash
      - package: FeatureAuth
        product: FeatureAuth
      - package: FeatureMain
        product: FeatureMain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.modularbank
        PRODUCT_NAME: ModularBank
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        SWIFT_STRICT_CONCURRENCY: targeted
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

schemes:
  ModularBank:
    build:
      targets:
        ModularBank: all
    run:
      config: Debug
      commandLineArguments:
        "-showFPS": false
        "-assertLeaks": false
        "-simulateRootedDevice": false
        "-simulateActiveCall": false
        "-simulateSplashFailure": false
        "-simulateMaintenance": false
        "-simulateForceUpdate": false
        "-useLiveServices": false
    test:
      config: Debug
      gatherCoverageData: true
    archive:
      config: Release
